name = "cob-codex-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "cob-codex"
database_id = "e729a86a-271b-4c81-99a7-a79ef7f897cd"
migrations_dir = "../../migrations"

# Secrets, set with `wrangler secret put`:
#   TURNSTILE_SECRET  uploads require a Turnstile token when this is set
#   INDEXER_TOKEN     what apps/indexer sends to /internal/*; locally, put it in .dev.vars

# Uploads per IP. Counters are per Cloudflare location and the period can only be 10 or 60
# seconds, so this stops bursts and scripts, not someone who is patient.
[[ratelimits]]
name = "UPLOAD_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Public reads per IP. A page view makes a handful, so this only bites a scraper.
[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
