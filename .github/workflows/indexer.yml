# Runs the engine over new builds and sends the numbers to the API. See apps/indexer.
name: indexer

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: indexer
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:vendor
      - run: npm run -w @cob/indexer start
        env:
          CATALOGUE_API: ${{ vars.CATALOGUE_API }}
          INDEXER_TOKEN: ${{ secrets.INDEXER_TOKEN }}
